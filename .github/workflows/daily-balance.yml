name: DESCO Daily Balance

on:
  # Schedule removed – GitHub's cron scheduler has known drift of up to several
  # hours on free runners. This workflow is now triggered at exactly 04:00 UTC
  # (10:00 AM Asia/Dhaka) by an external cron service (cron-job.org) via the
  # GitHub workflow_dispatch API. See README -> Fixing GitHub Actions Cron Drift.
  workflow_dispatch: {}    # triggered by cron-job.org; also allows manual runs

jobs:
  send-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
      - run: node dist/index.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DESCO_ACCOUNT_NO: ${{ secrets.DESCO_ACCOUNT_NO }}
          DESCO_METER_NO: ${{ secrets.DESCO_METER_NO }}
